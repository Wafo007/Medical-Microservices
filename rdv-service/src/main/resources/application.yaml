# ============================================
# CONFIGURATION RDV SERVICE
# ============================================
server:
  port: 8083

spring:
  application:
    name: RDV-SERVICE

  # ============================================
  # BASE DE DONNEES POSTGRESQL (3ème base)
  # ============================================
  datasource:
    url: jdbc:postgresql://localhost:5432/db_rendezvous
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# ============================================
# EUREKA
# ============================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ============================================
# CONFIGURATION MISTRAL AI
# ============================================
# Clé API gratuite obtenue sur : https://console.mistral.ai
# Le tier gratuit offre des crédits suffisants pour un devoir.
mistral:
  api:
    key: ${MISTRAL_API_KEY:Fwql6GCDstxJKserBBD6dXT7V10u8XSB}  # Variable d'env ou valeur par défaut
    url: https://api.mistral.ai/v1/chat/completions
    model: mistral-tiny  # Modèle gratuit/léger (suffisant pour suggestions)