




# ============================================
# CONFIGURATION API GATEWAY - FICHIER PROPERTIES
# ============================================
# Ce format est plus simple que YAML (pas d'indentation)
# et évite les erreurs de parsing

# Port du serveur
server.port=8080

# Nom de l'application
spring.application.name=API-GATEWAY

# ============================================
# BASE DE DONNEES POSTGRESQL
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/db_users
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# SPRING CLOUD GATEWAY - ROUTES
# ============================================
# Patient Service
spring.cloud.gateway.routes[0].id=patient-service
spring.cloud.gateway.routes[0].uri=lb://PATIENT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/patients/**

# Medecin Service
spring.cloud.gateway.routes[1].id=medecin-service
spring.cloud.gateway.routes[1].uri=lb://MEDECIN-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/medecins/**

# RDV Service
spring.cloud.gateway.routes[2].id=rdv-service
spring.cloud.gateway.routes[2].uri=lb://RDV-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/rendezvous/**

# ============================================
# EUREKA
# ============================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ============================================
# JWT
# ============================================
jwt.secret=maCleSecretePourLeDevoirMedical2026NePasUtiliserEnProduction
jwt.expiration=86400000

# Config CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true